        document.addEventListener('pointerdown', (e) => {
            const isInteractive = e.target.closest('input, textarea, select, button, .custom-switch');
            if (!isInteractive && window.getSelection().toString().length > 0) {
                window.getSelection().removeAllRanges();
            }
        });

        const $ = (id) => document.getElementById(id);
        const AppState = {
            users: JSON.parse(localStorage.getItem('fintrack_users')) || [],
            session: localStorage.getItem('fintrack_session') || null, 
            transactions: JSON.parse(localStorage.getItem('fintrack_tx')) || [],
            activeFilter: 'All',
            chartInstance: null
        };
        const saveUsers = () => localStorage.setItem('fintrack_users', JSON.stringify(AppState.users));
        const saveTxs = () => localStorage.setItem('fintrack_tx', JSON.stringify(AppState.transactions));

        function getCurrentUser() {
            return AppState.users.find(u => u.email === AppState.session) ?? null;
        }

        function getSettings() {
            const user = getCurrentUser();
            return user?.settings ?? { currency: '$', dark: false };
        }

        function getUserTransactions() {
            return AppState.transactions.filter(tx => tx.userEmail === AppState.session);
        }

        function loadDependencies(callback) {
            const fontLink = document.createElement('link');
            fontLink.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
            fontLink.rel = 'stylesheet';
            document.head.appendChild(fontLink);

            const chartScript = document.createElement('script');
            chartScript.src = 'https://cdn.jsdelivr.net/npm/chart.js';
            chartScript.onload = callback;
            chartScript.onerror = () => {
                console.warn('Chart.js failed to load. Continuing to initialize application without charts.');
                callback(); 
            };
            document.head.appendChild(chartScript);
        }

                        <div class="form-grid">
                            <div class="form-group"><label for="tx-amount">Amount</label><input type="number" id="tx-amount" min="0.01" step="0.01" required></div>
                            <div class="form-group"><label for="tx-date">Date</label><div class="date-wrapper"><input type="date" id="tx-date" required><svg class="date-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"></rect><line x1="16" y1="2" x2="16" y2="6" stroke-linecap="round" stroke-linejoin="round"></line><line x1="8" y1="2" x2="8" y2="6" stroke-linecap="round" stroke-linejoin="round"></line><line x1="3" y1="10" x2="21" y2="10" stroke-linecap="round" stroke-linejoin="round"></line></svg></div></div>
                        </div>
                        <div class="form-group"><label for="tx-category">Category</label><select id="tx-category" required><option value="">Select</option><option value="Salary">Salary</option><option value="Food">Food</option><option value="Shopping">Shopping</option><option value="Other">Other</option></select></div>
                        <div class="modal-actions">
                            <button type="button" class="btn btn-outline" id="close-modal-btn">Cancel</button>
                            <button type="submit" id="tx-submit-btn" class="btn btn-primary">Save Transaction</button>
                        </div>
                    </form>
                </dialog>
            `;
        }

        function applyScaling() {
            const app = $('app');
            const screenWidth = document.documentElement.clientWidth;
            const screenHeight = document.documentElement.clientHeight;
            const baseWidth = 1920; 
            
            app.style.position = 'relative';
            app.style.left = 'auto';
            app.style.top = 'auto';
            app.style.margin = '0';

            if (screenWidth > baseWidth) {
                
                const scaleFactor = screenWidth / baseWidth;
                document.documentElement.style.setProperty('--scale', scaleFactor);
                
                app.style.width = `${baseWidth}px`;
                app.style.height = `${screenHeight / scaleFactor}px`; 
                app.style.transform = `scale(${scaleFactor})`;
                app.style.transformOrigin = 'top left';
            } else {
                document.documentElement.style.setProperty('--scale', 1);
                app.style.width = '100%';
                app.style.height = '100vh';
                app.style.transform = 'none';
            }
        }
        window.addEventListener('resize', applyScaling);

        function toTitleCase(str) { return str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }

        function transitionView(updateDOM) {
            if (document.startViewTransition) {
                try {
                    const t = document.startViewTransition(updateDOM);
                    if(t.ready) t.ready.catch(() => {});
                    if(t.finished) t.finished.catch(() => {});
                    if(t.updateCallbackDone) t.updateCallbackDone.catch(() => {});
                } catch(e) {
                    updateDOM();
                }
            } else {
                updateDOM();
            }
        }

        function bindEvents() {
            
            $('go-to-register').addEventListener('click', () => transitionView(() => { toggleViews('register-view', ['login-view', 'register-view']); $('login-form').reset(); }));
            $('go-to-login').addEventListener('click', () => transitionView(() => { toggleViews('login-view', ['login-view', 'register-view']); $('register-form').reset(); }));
            
            ['reg-email', 'login-email', 'login-password'].forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => e.target.setCustomValidity(''));
            });

            const regEmail = $('reg-email');
            const emailFormat = $('req-email-format');
            const errSpan = $('email-taken-err');
            regEmail.addEventListener('input', (e) => {
                const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
                emailFormat.classList.toggle('valid', isValid);
                errSpan.style.display = 'none';
            });

            const regPwd = $('reg-password');
            const pwdReqs = {
                'req-pwd-len': (v) => v.length >= 8,
                'req-pwd-up': (v) => /[A-Z]/.test(v),
                'req-pwd-low': (v) => /[a-z]/.test(v),
                'req-pwd-num': (v) => /\d/.test(v),
                'req-pwd-sp': (v) => /[\W_]/.test(v)
            };

            regPwd.setCustomValidity('Please complete all requirements');

            regPwd.addEventListener('input', (e) => {
                const val = e.target.value;
                let allPassed = true;
                for (const [id, testFn] of Object.entries(pwdReqs)) {
                    const passed = testFn(val);
                    document.getElementById(id).classList.toggle('valid', passed);
                    if (!passed) allPassed = false;
                }
                
                if (allPassed) {
                    e.target.setCustomValidity('');
                } else {
                    e.target.setCustomValidity('Please complete all requirements');
                }
            });

            const formMaps = {
                'login-form': 'login-submit-btn',
                'register-form': 'reg-submit-btn',
                'tx-form': 'tx-submit-btn',
                'settings-form': 'save-settings-btn'
            };

            ['reg-name', 'setting-name'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', (e) => e.target.value = toTitleCase(e.target.value));
            });

            Object.keys(formMaps).forEach(id => {
                const form = document.getElementById(id);
                if (!form) return;
                form.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const inputs = Array.from(form.elements).filter(el => !el.disabled && (el.tagName === 'INPUT' || el.tagName === 'SELECT'));
                        const submitBtn = form.querySelector('button[type="submit"]');
                        const invalidInputs = inputs.filter(el => !el.checkValidity() || (el.tagName === 'INPUT' && el.value.trim() === ''));

                        if (invalidInputs.length === 0 && submitBtn && !submitBtn.disabled) {
                            submitBtn.click();
                            return;
                        }

                        if (!e.target.checkValidity() || (e.target.tagName === 'INPUT' && e.target.value.trim() === '')) {
                            e.target.reportValidity();
                            return; 
                        }

                        const currentIndex = inputs.indexOf(e.target);
                        if (currentIndex > -1 && currentIndex < inputs.length - 1) {
                            inputs[currentIndex + 1].focus();
                        } else if (invalidInputs.length > 0) {
                            
                            invalidInputs[0].focus();
                            invalidInputs[0].reportValidity();
                        }
                    }
                });
            });

            $('register-form').addEventListener('submit', handleRegister);
            $('login-form').addEventListener('submit', handleLogin);
            $('logout-btn').addEventListener('click', handleLogout);

            $('nav-dashboard').addEventListener('click', () => showPage('dashboard'));
            $('nav-settings').addEventListener('click', () => showPage('settings'));
            $('logo-btn').addEventListener('click', () => { if(AppState.session) showPage('dashboard'); });

            const modal = $('tx-modal');
            $('open-modal-btn').addEventListener('click', () => {
                modal.showModal();
                $('tx-date').valueAsDate = new Date();
            });
            $('close-modal-btn').addEventListener('click', closeModal);
            $('close-modal-icon').addEventListener('click', closeModal);

            modal.addEventListener('click', (e) => { 
                const rect = modal.getBoundingClientRect();
                const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height && rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
                if (!isInDialog) closeModal(); 
            });
            
            $('tx-form').addEventListener('submit', addTransaction);

            initCustomSelects();

            document.querySelectorAll('.date-wrapper .date-icon').forEach(icon => {
                icon.style.pointerEvents = 'auto';
                icon.style.cursor = 'pointer';
                icon.addEventListener('click', () => {
                    const input = icon.closest('.date-wrapper')?.querySelector('input[type="date"]');
                    if (input) { try { input.showPicker(); } catch(e) { input.focus(); } }
                });
            });

            $('filter-container').addEventListener('click', (e) => { 
                if (e.target.classList.contains('filter-btn')) { 
                    AppState.activeFilter = e.target.dataset.filter; 
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); 
                    e.target.classList.add('active'); 
                    masterRefresh(); 
                } 
            });

            $('settings-form').addEventListener('submit', saveSettings);
            $('dark-toggle').addEventListener('click', toggleDarkMode);
            $('reset-btn-dash').addEventListener('click', resetUserData);

            $('tx-tbody').addEventListener('click', (e) => { 
                const btn = e.target.closest('.del-btn'); 
                if(btn && confirm("Delete transaction?")) { 
                    AppState.transactions = AppState.transactions.filter(t => t.id !== parseInt(btn.dataset.id)); 
                    saveTxs(); 
                    masterRefresh(); 
                } 
            });
        }

        function initCustomSelects() {
            document.querySelectorAll('select').forEach(sel => {
                if (sel.dataset.customized) return;
                sel.dataset.customized = 'true';
                sel.style.display = 'none';
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-select-ui';
                const trigger = document.createElement('div');
                trigger.className = 'select-selected';
                trigger.textContent = sel.options[sel.selectedIndex]?.text || 'Select';
                const menu = document.createElement('div');
                menu.className = 'select-items select-hide';
                Array.from(sel.options).forEach((opt, i) => {
                    const item = document.createElement('div');
                    item.textContent = opt.text;
                    if (i === sel.selectedIndex) item.classList.add('same-as-selected');
                    item.addEventListener('click', e => {
                        e.stopPropagation();
                        sel.selectedIndex = i;
                        trigger.textContent = opt.text;
                        sel.dispatchEvent(new Event('change'));
                        menu.querySelectorAll('.same-as-selected').forEach(s => s.classList.remove('same-as-selected'));
                        item.classList.add('same-as-selected');
                        menu.classList.add('select-hide');
                        trigger.classList.remove('select-arrow-active');
                    });
                    menu.appendChild(item);
                });
                wrapper.appendChild(trigger);
                wrapper.appendChild(menu);
                sel.parentNode.insertBefore(wrapper, sel.nextSibling);
                trigger.addEventListener('click', e => {
                    e.stopPropagation();
                    const wasHidden = menu.classList.contains('select-hide');
                    closeAllCustomSelects();
                    if (wasHidden) {
                        menu.classList.remove('select-hide');
                        trigger.classList.add('select-arrow-active');
                    }
                });
            });
        }
        function closeAllCustomSelects() {
            document.querySelectorAll('.select-items').forEach(m => m.classList.add('select-hide'));
            document.querySelectorAll('.select-selected').forEach(t => t.classList.remove('select-arrow-active'));
        }
        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select-ui')) closeAllCustomSelects();
        });

        function handleRegister(e) {
            e.preventDefault();
            const form = e.target;

            if (!form.checkValidity()) {
                const invalidInput = Array.from(form.elements).find(el => !el.checkValidity());
                if (invalidInput) invalidInput.focus();
                return; 
            }

            const emailInput = $('reg-email');
            const email = emailInput.value.trim().toLowerCase();
            const errSpan = $('email-taken-err');
            
            if (AppState.users.some(u => u.email === email)) { 
                emailInput.setCustomValidity("Email already registered");
                errSpan.style.display = 'block';
                emailInput.focus();
                return; 
            } else {
                emailInput.setCustomValidity("");
                errSpan.style.display = 'none';
            }

            const name = $('reg-name').value.trim();
            const password = $('reg-password').value;
            
            AppState.users.push({ name, email, password, settings: { currency: '$', dark: false } });
            saveUsers();
            
            loginUser(email);
        }

        function handleLogin(e) {
            e.preventDefault();
            const emailInput = $('login-email');
            const passwordInput = $('login-password');
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            emailInput.setCustomValidity("");
            passwordInput.setCustomValidity("");

            const userByEmail = AppState.users.find(u => u.email === email);
            if (!userByEmail) {
                emailInput.setCustomValidity("Email not registered");
                emailInput.reportValidity();
                return;
            }

            if (userByEmail.password !== password) {
                passwordInput.setCustomValidity("Incorrect password");
                passwordInput.reportValidity();
                return;
            }

            loginUser(email);
        }

        function loginUser(email) {
            AppState.session = email; localStorage.setItem('fintrack_session', email);
            $('login-form').reset(); $('register-form').reset();
            applySettings(); masterRefresh(); showPage('dashboard');
        }

        function toggleViews(activeId, viewIds) {
            viewIds.forEach(id => document.getElementById(id).classList.toggle('hidden', id !== activeId));
        }

        function handleLogout() {
            AppState.session = null; localStorage.removeItem('fintrack_session');
            document.body.classList.remove('dark-mode'); 
            transitionView(() => {
                toggleViews('login-view', ['login-view', 'register-view', 'dashboard-layout']);
            });
        }

        function resetUserData() {
            if (confirm("🚨 WARNING: Delete all your data? This cannot be undone.")) {
                AppState.transactions = AppState.transactions.filter(tx => tx.userEmail !== AppState.session); 
                saveTxs();
                masterRefresh();
            }
        }

        function showPage(id) {
            if (!AppState.session) return;
            transitionView(() => {
                toggleViews('dashboard-layout', ['login-view', 'register-view', 'dashboard-layout']);
                toggleViews(`${id}-page`, ['dashboard-page', 'settings-page']);
                
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                document.getElementById(`nav-${id}`).classList.add('active');
            });
        }

        function closeModal() { 
            const modal = $('tx-modal');
            modal.close(); 
            $('tx-form').reset(); 
            $('tx-date').valueAsDate = new Date(); 
        }

        function addTransaction(e) {
            e.preventDefault();
            const category = $('tx-category').value;
            if (!category) {
                alert("Please select a category.");
                return;
            }
            AppState.transactions.push({ id: Date.now(), userEmail: AppState.session, type: $('tx-type').value, desc: $('tx-desc').value.trim(), amount: parseFloat($('tx-amount').value), category: category, date: $('tx-date').value });
            saveTxs(); closeModal(); masterRefresh();
        }

        function formatCurrency(amount) { return `${getSettings()?.currency ?? '$'}${amount.toFixed(2)}`; }

        function masterRefresh() {
            if (!AppState.session) return;
            const txs = getUserTransactions();
            const grouped = Object.groupBy ? Object.groupBy(txs, t => t.type) : { Income: txs.filter(t => t.type === 'Income'), Expense: txs.filter(t => t.type === 'Expense') };
            const inc = (grouped.Income || []).reduce((sum, t) => sum + t.amount, 0);
            const exp = (grouped.Expense || []).reduce((sum, t) => sum + t.amount, 0);
            $('total-balance').textContent = formatCurrency(inc - exp);
            $('total-income').textContent = formatCurrency(inc);
            $('total-expense').textContent = formatCurrency(exp);
            $('total-txCount').textContent = txs.length;
            
            const tbody = $('tx-tbody');
            const filtered = AppState.activeFilter === 'All' ? txs : txs.filter(t => t.type === AppState.activeFilter);
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 0.95rem; background: transparent; box-shadow: none;">No transactions found.</td></tr>`;
            } else {
                tbody.innerHTML = filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).map(tx => {
                    const isInc = tx.type === 'Income';
                    return `<tr><td data-label="Date">${tx.date}</td><td data-label="Description" style="font-weight:500;">${tx.desc}</td><td data-label="Category"><span class="badge ${isInc ? 'badge-income' : 'badge-expense'}">${tx.category}</span></td><td data-label="Amount" class="${isInc ? 'val-income' : 'val-expense'}" style="font-weight:600;">${isInc ? '+' : '-'}${formatCurrency(tx.amount)}</td><td data-label="Action"><button class="del-btn" data-id="${tx.id}">🗑️</button></td></tr>`;
                }).join('');
            }

            if(window.Chart) {
                if(AppState.chartInstance) AppState.chartInstance.destroy();

                const groupedTxs = Object.groupBy ? Object.groupBy(txs, tx => tx.date) : 
                    txs.reduce((acc, tx) => {
                        (acc[tx.date] = acc[tx.date] || []).push(tx);
                        return acc;
                    }, {});

                const labels = Object.keys(groupedTxs ?? {}).sort((a,b) => new Date(a) - new Date(b));
                const incData = labels.map(date => groupedTxs[date].filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0));
                const expData = labels.map(date => groupedTxs[date].filter(t => t.type === 'Expense').reduce((s, t) => s + t.amount, 0));

                const isDark = getSettings()?.dark ?? false;
                const chartCanvas = $('cashFlowChart');
                const chartParent = chartCanvas.parentElement;

                if (labels.length === 0) {
                    chartCanvas.style.display = 'none';
                    let emptyState = $('chart-empty-state');
                    if (!emptyState) {
                        emptyState = document.createElement('div');
                        emptyState.id = 'chart-empty-state';
                        emptyState.className = 'empty-chart-state';
                        emptyState.innerHTML = `
                            <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                                <rect width="240" height="240" fill="transparent"/>
                                
                                <path d="M40 180 L200 180" stroke="var(--border)" stroke-width="2" stroke-linecap="round"/>
                                <path d="M40 140 L200 140 M40 100 L200 100 M40 60 L200 60" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
                                
                                <rect x="60" y="120" width="24" height="60" rx="4" fill="var(--income)" opacity="0.3"/>
                                <rect x="90" y="90" width="24" height="90" rx="4" fill="var(--expense)" opacity="0.3"/>
                                <rect x="130" y="140" width="24" height="40" rx="4" fill="var(--income)" opacity="0.3"/>
                                <rect x="160" y="70" width="24" height="110" rx="4" fill="var(--expense)" opacity="0.3"/>
                                
                                <circle cx="120" cy="120" r="24" fill="var(--card-bg)" stroke="var(--border)" stroke-width="3"/>
                                <path d="M110 110 L130 130 M130 110 L110 130" stroke="var(--text-muted)" stroke-width="3" stroke-linecap="round"/>
                            </svg>
                            <div>
                                <h3>No Activity Yet</h3>
                                <p>Add a transaction to see your cash flow</p>
                            </div>
                        `;
                        chartParent.appendChild(emptyState);
                    }
                    emptyState.style.display = 'flex';
                } else {
                    chartCanvas.style.display = 'block';
                    const emptyState = $('chart-empty-state');
                    if (emptyState) emptyState.style.display = 'none';

                    AppState.chartInstance = new Chart(chartCanvas.getContext('2d'), { 
                        type: 'bar', 
                        data: { 
                            labels: labels, 
                            datasets: [
                                {label:'Income', data: incData, backgroundColor: '#10b981', borderRadius: 4, maxBarThickness: 45}, 
                                {label:'Expense', data: expData, backgroundColor: '#ef4444', borderRadius: 4, maxBarThickness: 45}
                            ] 
                        }, 
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            scales: {
                                y: {grid: {color: isDark ? '#374151' : '#e5e7eb'}, ticks: {color: isDark ? '#9ca3af' : '#6b7280'}}, 
                                x: {grid: {display: false}, ticks: {color: isDark ? '#9ca3af' : '#6b7280'}}
                            }, 
                            plugins: {
                                legend: {
                                    align: 'center',
                                    labels: {
                                        color: isDark ? '#f9fafb' : '#1f2937',
                                        usePointStyle: true,
                                        pointStyle: 'rectRounded',
                                        boxWidth: 14,
                                        boxPadding: 6,
                                        padding: 20,
                                        font: { size: 12 }
                                    }
                                }
                            }
                        },
                        plugins: [{
                            id: 'legendMarginBottom',
                            beforeInit(chart) {
                                const originalFit = chart.legend.fit;
                                chart.legend.fit = function fit() {
                                    originalFit.bind(chart.legend)();
                                    return this.height += 16;
                                };
                            }
                        }]
                    });
                }
            }
        }

        function toggleDarkMode() { 
            const user = getCurrentUser(); if(!user) return; 
            user.settings.dark = !user.settings.dark; 
            saveUsers(); 
            applySettings(); 
            if(AppState.chartInstance) masterRefresh(); 
        }

        function saveSettings(e) { 
            if (e) e.preventDefault();
            const user = getCurrentUser(); if(!user) return; 
            user.name = $('setting-name').value; 
            user.settings.currency = $('setting-currency').value; 
            saveUsers(); 
            applySettings(); 
            masterRefresh(); 
            alert('Settings saved successfully!');
        }
        
        function applySettings() {
            const user = getCurrentUser(); if(!user) return;
            $('greeting-name').textContent = user.name; 
            $('setting-name').value = user.name; 
            $('setting-currency').value = user.settings.currency;
            document.body.classList.toggle('dark-mode', user.settings.dark);
        }

        function initApp() {
            injectCSS(); buildUI(); bindEvents(); applyScaling();
            
            if (AppState.session && getCurrentUser()) {
                $('login-view').classList.add('hidden'); 
                applySettings();
                loadDependencies(() => { masterRefresh(); showPage('dashboard'); });
            } else {
                handleLogout(); 
                loadDependencies(()=>{});
            }
        }
        initApp();
    </script>
</body>
</html>
